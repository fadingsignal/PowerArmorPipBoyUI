[General]
; Settings are reloaded whenever the Pip-Boy opens and before a forced close.
; Fallout 4 does not need to be restarted after editing this file.
;
; 1 uses the fullscreen power-armor Pip-Boy interface even when the player
; is not wearing power armor. 0 restores Fallout 4's normal behavior.
bForcePowerArmorPipboy=1

; 1 plays the power-armor Pip-Boy open/close sounds outside power armor.
; These include the Power Armor Pip-Boy activation buzz.
bPowerArmorAudio=1

; In power armor the game leaves the Pip-Boy light alone while the menu is
; open. Outside power armor it switches the light off and restores it on
; close. 1 adopts the power-armor behavior; 0 keeps Fallout 4's.
bKeepPipboyLightOn=1

; 1 replaces the Power Armor Pip-Boy's fixed orange effect color with the
; fPipboyEffectColorR/G/B values loaded from Fallout4Prefs.ini. This uses the
; same player-selected color for both genuine and forced Power Armor Pip-Boys.
; 0 keeps Fallout 4's fPAEffectColorR/G/B values.
bUsePipboyEffectColor=0
